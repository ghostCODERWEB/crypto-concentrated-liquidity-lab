[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-concentrated-liquidity-lab"
version = "0.1.0"
description = "Analyze range liquidity, tick segments, inventory changes and impermanent loss across price trajectories."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-concentrated-liquidity-lab = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
